name: Preview (EAS Update)

# Publica um EAS Update por PR e comenta o QR code para abrir no Expo Go.
on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # comentar o QR code no PR

jobs:
  update:
    name: Publicar preview
    runs-on: ubuntu-latest
    # PRs de forks não recebem os secrets: sem token não há como publicar.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publicar update e comentar o QR code
        uses: expo/expo-github-action/preview@v8
        env:
          # Entram no bundle (públicas). Apontam para o Supabase patinha-dev.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Runtime "exposdk:<SDK>" para o Expo Go abrir o update (ver app.config.ts).
          EXPO_GO_PREVIEW: 'true'
        with:
          qr-target: expo-go
          # --branch explícito: no PR o checkout fica em HEAD destacado e o --auto
          # não acha o nome da branch. --environment é obrigatório a partir do SDK 55.
          command: eas update --auto --branch ${{ github.event.pull_request.head.ref }} --environment preview --platform all
